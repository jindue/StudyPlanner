<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StudyPlanner</title>
<style>
:root{
  --bg:#0a0a0f;--s1:#12121a;--s2:#1a1a26;--s3:#222232;
  --b1:#2c2c3e;--b2:#3a3a52;
  --t1:#f0f0f8;--t2:#8888aa;--t3:#44445a;
  --ac:#6c63ff;--ac2:#9d96ff;
  --ok:#34d399;--wa:#fbbf24;--er:#f87171;--gold:#f59e0b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
input{-webkit-user-select:text;user-select:text}

#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
.sp-mascot{width:120px;height:120px;object-fit:contain;animation:spPop .7s cubic-bezier(.34,1.56,.64,1) .2s both}
@keyframes spPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.sp-title{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:16px;animation:spUp .45s ease .7s both}
.sp-title span{color:#9d96ff}
.sp-sub{font-size:13px;color:var(--t2);margin-top:5px;animation:spUp .45s ease .9s both}
.sp-track{width:140px;height:3px;background:var(--s3);border-radius:3px;margin-top:36px;overflow:hidden;animation:spUp .4s ease 1.05s both}
.sp-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:3px;animation:spBar 1.5s ease 1.05s both}
@keyframes spBar{from{width:0}to{width:100%}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.screen{flex:1;overflow:hidden;display:none;flex-direction:column}
.screen.active{display:flex}

.tabbar{display:flex;flex-shrink:0;background:#15151c;border-top:1px solid rgba(255,255,255,.06);padding:6px 8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 0;cursor:pointer;color:#7a7a90}
.tab.active{color:var(--ac2)}
.tab-ico{width:48px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:22px;transition:background .2s,color .2s}
.tab-ico svg{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.active .tab-ico{background:var(--ac);color:#fff;box-shadow:0 4px 12px rgba(108,99,255,.45)}
.tab.active .tab-ico svg{stroke:#fff}
.tab-lbl{font-size:11px;font-weight:600}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0}
.tb-title{font-size:17px;font-weight:700}
.tb-add{background:var(--ac);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tb-add:active{opacity:.75}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.scroll::-webkit-scrollbar{width:3px}.scroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

.date-nav{display:flex;align-items:center;justify-content:center;gap:4px;flex:1}
.date-nav-btn{width:34px;height:34px;border:none;background:none;color:var(--ac2);font-size:20px;cursor:pointer}
.date-nav-center{text-align:center;min-width:110px}
.date-nav-main{font-size:15px;font-weight:700}
.date-nav-sub{font-size:10px;color:var(--t3)}
.total-bar{margin:0 16px 14px;background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-lbl{font-size:11px;color:var(--t2);margin-bottom:3px}
.tb-time{font-size:26px;font-weight:700;color:var(--ac2);font-variant-numeric:tabular-nums}
.tb-chips{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600}
.c-ok{background:rgba(52,211,153,.13);color:var(--ok)}.c-wa{background:rgba(251,191,36,.13);color:var(--wa)}.c-er{background:rgba(248,113,113,.13);color:var(--er)}
.tc{background:var(--s1);border:1px solid var(--b1);border-radius:14px;margin-bottom:11px;overflow:hidden}
.tc-body{padding:13px 14px}
.tc-row1{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.cdot{width:12px;height:12px;border-radius:50%;flex-shrink:0;cursor:pointer}
.name-inp{flex:1;background:none;border:none;outline:none;font-size:15px;font-weight:500;color:var(--t1);font-family:inherit;min-width:0}
.del-btn{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--t3);font-size:15px;cursor:pointer}
.del-btn:active{background:rgba(248,113,113,.15);color:var(--er)}
.st-row{display:flex;gap:7px;margin-bottom:10px}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--b1);background:var(--s2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sb.s-ok{background:rgba(52,211,153,.14);border-color:var(--ok)}.sb.s-wa{background:rgba(251,191,36,.14);border-color:var(--wa)}.sb.s-er{background:rgba(248,113,113,.14);border-color:var(--er)}
.timer-row{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:10px;padding:10px 12px}
.t-num{flex:1;font-size:20px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.t-num.run{color:var(--ac2)}
.tbtn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.tbtn.start{background:rgba(108,99,255,.15);border-color:var(--ac);color:var(--ac2)}
.tbtn.stop{background:rgba(248,113,113,.13);border-color:var(--er);color:var(--er)}

.cal-mth{font-size:20px;font-weight:700}
.cnb{width:36px;height:36px;border-radius:10px;border:1px solid var(--b1);background:var(--s2);color:var(--t2);font-size:18px;cursor:pointer}
.dow{display:grid;grid-template-columns:repeat(7,1fr);flex-shrink:0;padding:0 6px}
.dow span{text-align:center;font-size:11px;color:var(--t3);font-weight:600;padding:6px 0}
.dow span:first-child{color:#f87171}.dow span:last-child{color:#818cf8}
.cal-grid{flex:1;display:flex;flex-direction:column;padding:0 6px 10px;overflow-y:auto}
.cal-week{flex:1;display:grid;grid-template-columns:repeat(7,1fr);position:relative;min-height:96px;border-top:1px solid var(--s2)}
.cal-day{padding:4px 4px 0;position:relative;cursor:pointer;border-right:1px solid var(--s2)}
.cal-day:last-child{border-right:none}
.cal-day.other .day-num{color:var(--t3)}
.cal-day.selected{background:rgba(255,255,255,.07)}
.cal-day.today .day-num{background:var(--ac);color:#fff;border-radius:50%}
.day-num{font-size:13px;font-weight:600;color:var(--t1);width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.cal-day:nth-child(7n+1) .day-num{color:#f87171}.cal-day:nth-child(7n) .day-num{color:#818cf8}
.cal-day.today .day-num{color:#fff !important}
.evt-bar{position:absolute;height:17px;border-radius:4px;font-size:10px;font-weight:600;color:#fff;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.evt-bar.cont-left{border-top-left-radius:0;border-bottom-left-radius:0}
.evt-bar.cont-right{border-top-right-radius:0;border-bottom-right-radius:0}
.cal-study{position:absolute;left:4px;right:4px;bottom:4px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-height:14px;overflow:hidden}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-studytime{font-size:9px;font-weight:700;color:var(--ac2);font-variant-numeric:tabular-nums}

.tt-hero{background:linear-gradient(135deg,#9d6cdf,#7c5cd6);padding:14px 18px 16px;flex-shrink:0}
.tt-hero-time{font-size:30px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.tt-hero-date{display:flex;align-items:center;gap:10px;color:#fff;margin-top:2px}
.tt-hero-btn{background:none;border:none;color:rgba(255,255,255,.8);font-size:18px;cursor:pointer}
.tt-main{flex:1;display:flex;overflow:hidden}
.tt-left{width:46%;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--b1)}
.tt-left-head{padding:10px 14px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--b1)}
.tt-subj-scroll{flex:1;overflow-y:auto}
.tt-subj{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--s2);cursor:pointer}
.tt-subj.selected{background:var(--s2)}
.tt-subj-bar{width:4px;align-self:stretch;border-radius:4px;min-height:36px}
.tt-subj-info{flex:1;min-width:0}
.tt-subj-name{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt-subj-time{font-size:13px;color:var(--t2);font-family:monospace;margin-top:3px}
.tt-subj-status{font-size:13px;flex-shrink:0}
.tt-left-tools{padding:12px;border-top:1px solid var(--b1)}
.lt-btn{width:100%;height:40px;border-radius:10px;border:none;background:var(--s2);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.tt-right{flex:1;display:flex;flex-direction:column}
.tt-sel-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--b1);background:var(--s1)}
.tt-sel-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.tt-sel-txt{font-size:11px;color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-wrap{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mode-lbl{font-size:11px;font-weight:600;color:var(--t3);white-space:nowrap}
.mode-lbl.active{color:var(--ac2)}
.mode-toggle{width:46px;min-width:46px;max-width:46px;height:26px;border-radius:20px;border:none;background:var(--ac);cursor:pointer;position:relative;padding:0;flex-shrink:0;transition:background .25s}
.mode-toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.4,0,.2,1);transform:translateX(0)}
.mode-toggle.right::after{transform:translateX(20px)}
.tt-scroll{flex:1;overflow-y:auto;padding:4px 8px 20px;position:relative}
.tt-inner{position:relative}
.tt-trow{display:flex;height:26px}
.tt-hour{width:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t2)}
.tt-cells{flex:1;display:grid;grid-template-columns:repeat(6,1fr)}
.tt-cell{border:0.5px solid var(--b1);cursor:pointer;position:relative}
.block-label{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.55);z-index:4;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ===== 통합 플래너 (좌:할일+타이머 / 우:시간표) ===== */
.pl-main{flex:1;display:flex;overflow:hidden}
.pl-left{width:54%;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--b1)}
.pl-left-scroll{flex:1;overflow-y:auto;padding:0 10px 14px}
.pl-left-scroll::-webkit-scrollbar{width:3px}.pl-left-scroll::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.pl-mini-total{display:flex;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--b1);border-radius:12px;padding:9px 11px;margin:0 0 10px}
.pl-mini-total .tb-time{font-size:20px}
.pl-mini-chips{display:flex;gap:4px}
.pl-mini-chips .chip{font-size:10px;padding:2px 7px}
.pl-add-btn{width:100%;height:38px;border-radius:10px;border:1px dashed var(--b2);background:var(--s1);color:var(--ac2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px}
.pl-add-btn:active{opacity:.7}
/* 좌측 컴팩트 할일 카드 */
.pc{background:var(--s1);border:1px solid var(--b1);border-radius:12px;margin-bottom:9px;overflow:hidden}
.pc-body{padding:10px 11px}
.pc-row1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pc-name{flex:1;background:none;border:none;outline:none;font-size:13px;font-weight:500;color:var(--t1);font-family:inherit;min-width:0}
.pc-del{width:26px;height:26px;border-radius:7px;border:none;background:none;color:var(--t3);font-size:13px;cursor:pointer;flex-shrink:0}
.pc-del:active{background:rgba(248,113,113,.15);color:var(--er)}
.pc-st-row{display:flex;gap:6px;margin-bottom:8px}
.pc-sb{flex:1;height:32px;border-radius:8px;border:1px solid var(--b1);background:var(--s2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.pc-sb.s-ok{background:rgba(52,211,153,.14);border-color:var(--ok);color:var(--ok)}
.pc-sb.s-wa{background:rgba(251,191,36,.14);border-color:var(--wa);color:var(--wa)}
.pc-sb.s-er{background:rgba(248,113,113,.14);border-color:var(--er);color:var(--er)}
.pc-timer{display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:8px;padding:7px 9px}
.pc-tnum{flex:1;font-size:15px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.pc-tnum.run{color:var(--ac2)}
.pc-tbtn{height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--b1);background:var(--s1);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.pc-tbtn.start{background:rgba(108,99,255,.15);border-color:var(--ac);color:var(--ac2)}
.pc-tbtn.stop{background:rgba(248,113,113,.13);border-color:var(--er);color:var(--er)}
.pc-sel{box-shadow:0 0 0 2px var(--ac2) inset}
.char-scroll{flex:1;overflow-y:auto;padding:0 16px 20px}
.ai-section{background:linear-gradient(135deg,rgba(108,99,255,.12),rgba(167,139,250,.08));border:1px solid rgba(108,99,255,.25);border-radius:16px;padding:16px;margin-bottom:16px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ai-orb{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ai-title{font-size:14px;font-weight:600}
.ai-sub{font-size:11px;color:var(--t2);margin-top:1px}
.ai-fb{font-size:13px;line-height:1.65;margin-bottom:12px;min-height:52px}
.ai-fb.loading{color:var(--t2)}
.ai-btn{width:100%;padding:11px;border-radius:10px;background:var(--ac);border:none;color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
.char-card{background:linear-gradient(160deg,rgba(108,99,255,.12),rgba(52,211,153,.06));border:1px solid var(--b1);border-radius:20px;padding:24px 20px;text-align:center}
.char-mascot{width:150px;height:150px;object-fit:contain;margin:0 auto 12px;display:block}
.char-name{font-size:20px;font-weight:800}
.char-class{font-size:12px;color:var(--ac2);margin-top:3px}
.char-lv-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 10px}
.lv-badge{background:linear-gradient(135deg,var(--gold),#f97316);color:#000;font-size:14px;font-weight:800;padding:5px 14px;border-radius:20px}
.lv-title{font-size:13px;color:var(--t2)}
.xp-wrap{background:var(--s3);border-radius:20px;height:8px;overflow:hidden;margin-bottom:6px}
.xp-fill{height:100%;background:linear-gradient(90deg,#a78bfa,var(--ac2));border-radius:20px;transition:width .6s}
.xp-lbl{font-size:11px;color:var(--t3)}
.cstat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.cstat{background:var(--s2);border-radius:12px;padding:10px 8px}
.cstat-val{font-size:18px;font-weight:700}
.cstat-lbl{font-size:10px;color:var(--t2);margin-top:2px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-bg.center{align-items:center;justify-content:center;padding:20px}
.modal-bg.open{opacity:1;pointer-events:all}
.sheet{background:var(--s1);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.modal-bg.center .sheet{border-radius:20px;max-width:340px;transform:scale(.92)}
.modal-bg.open .sheet{transform:translateY(0)}
.modal-bg.center.open .sheet{transform:scale(1)}
.m-handle{width:36px;height:4px;background:var(--b2);border-radius:4px;margin:0 auto 18px}
.m-title{font-size:16px;font-weight:600;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--t2);display:block;margin-bottom:5px}
.m-inp{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;color:var(--t1);padding:11px 14px;font-size:14px;font-family:inherit;outline:none}
.m-inp:focus{border-color:var(--ac)}
.date-row{display:flex;gap:8px;align-items:center}.date-row .m-inp{flex:1}.date-row span{color:var(--t2)}
.m-colors{display:flex;gap:8px;flex-wrap:wrap}
.msw{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent}.msw.on{border-color:#fff}
.custom-wrap{position:relative;width:32px;height:32px}
.custom-wrap input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.custom-vis{width:32px;height:32px;border-radius:50%;border:2px dashed var(--b2);display:flex;align-items:center;justify-content:center;color:var(--t2);pointer-events:none}
.m-btns{display:flex;gap:8px;margin-top:16px}
.m-btn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:none}
.m-cancel{background:var(--s2);border:1px solid var(--b1);color:var(--t2)}
.m-save{background:var(--ac);color:#fff}
.m-del{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171}
.hint{font-size:11px;color:var(--t3);margin-top:4px}
</style>
</head>
<body>

<div id="splash">
  <img class="sp-mascot" id="sp-mascot" alt="mascot">
  <div class="sp-title">Study<span>Planner</span></div>
  <div class="sp-sub">오늘도 집중해봐요 ✦</div>
  <div class="sp-track"><div class="sp-fill"></div></div>
</div>

<div class="screen active" id="screen-plan">
  <div class="tt-hero">
    <div class="tt-hero-time" id="tt-hero-time">00:00:00</div>
    <div class="tt-hero-date"><button class="tt-hero-btn" id="ck-prev">‹</button><span id="tt-date" style="font-size:15px;font-weight:600">2026.06.02</span><button class="tt-hero-btn" id="ck-next">›</button></div>
  </div>
  <div class="pl-main">
    <div class="pl-left">
      <div class="pl-left-scroll" id="pl-left-scroll">
        <div class="pl-mini-total">
          <div><div class="tb-lbl">총 공부 시간</div><div class="tb-time" id="ck-total">00:00:00</div></div>
          <div class="pl-mini-chips"><span class="chip c-ok" id="ck-ok">○ 0</span><span class="chip c-wa" id="ck-wa">△ 0</span><span class="chip c-er" id="ck-er">✕ 0</span></div>
        </div>
        <div id="ck-list"></div>
        <button class="pl-add-btn" id="ck-add">＋ 할일/과목 추가</button>
      </div>
    </div>
    <div class="tt-right">
      <div class="tt-sel-bar">
        <div class="tt-sel-dot" id="tt-sel-dot" style="background:#6c63ff"></div>

var items={};        // "date":[{id,name,color,status,elapsed,running,startedAt}]
var events=[];       // 일정
var ttData={};       // 타임테이블 색칠: "date|r-c":{color,itemId}
var blockTexts={};   // "date|blockId":text
var charName='학습자';

var ckDate=new Date(), calDate=new Date();
var ttDate=ckDate; // 타임테이블은 체크리스트와 같은 날짜 공유
var calSelDate=null, ttSelItem=null, ttTool='paint', ttDown=false, ttDragMode=null, ttAddMode=false;

function save(){try{localStorage.setItem('sp_v2',JSON.stringify({items:items,events:events,ttData:ttData,blockTexts:blockTexts,charName:charName}))}catch(e){}}
function load(){try{var d=localStorage.getItem('sp_v2');if(d){var o=JSON.parse(d);items=o.items||{};events=o.events||[];ttData=o.ttData||{};blockTexts=o.blockTexts||{};charName=o.charName||'학습자';Object.keys(items).forEach(function(k){items[k].forEach(function(t){t.running=false;t.startedAt=0})})}}catch(e){}}

function dayItems(key){return items[key]||[]}
function ckKey(){return dateKey(ckDate)}
function ttKeyDate(){return dateKey(ttDate)}

function getTotalXP(){var s=0;Object.keys(items).forEach(function(k){items[k].forEach(function(t){if(t.status==='ok')s+=t.elapsed+600;else if(t.status==='wa')s+=Math.floor(t.elapsed*0.5);else if(t.status==='er')s+=0;else s+=Math.floor(t.elapsed*0.25)})});return Math.floor(s/60)}
function levelInfo(xp){for(var i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].min)return LEVELS[i]}return LEVELS[0]}

function addCustomSwatch(row,cb){var wrap=document.createElement('div');wrap.className='custom-wrap';wrap.innerHTML='<div class="custom-vis">+</div><input type="color" value="#ff66cc">';wrap.querySelector('input').addEventListener('input',function(e){cb(e.target.value);row.querySelectorAll('.msw').forEach(function(s){s.classList.remove('on')});wrap.querySelector('.custom-vis').style.background=e.target.value;wrap.querySelector('.custom-vis').textContent=''});row.appendChild(wrap)}

// ═══ 탭 전환 ═══
document.querySelectorAll('.tab').forEach(function(tab){tab.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});tab.classList.add('active');document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});var sc=tab.getAttribute('data-screen');ge(sc).classList.add('active');if(sc==='screen-char')updateChar();if(sc==='screen-cal')renderCalendar();if(sc==='screen-plan'){renderPlan();setTimeout(renderBlockLabels,50)}})});

// 통합 플래너 렌더: 좌측 할일카드 + 우측 시간표를 한 번에

function refreshActive(){
  if(ge('screen-plan').classList.contains('active')){renderCk();buildTtTable();restoreTt();renderBlockLabels();updateTtHero()}

}

// ═══════════ 통합 플래너 좌측: 할일 카드 ═══════════
var ckTimers={};
function renderCk(){
  ge('tt-date').textContent=ckDate.getFullYear()+'.'+pad(ckDate.getMonth()+1)+'.'+pad(ckDate.getDate());
  var list=ge('ck-list'),ts=dayItems(ckKey());
  if(!ts.length){list.innerHTML='<div style="text-align:center;padding:34px 12px;color:var(--t3)"><div style="font-size:36px;margin-bottom:8px">✏️</div><div style="font-size:13px;line-height:1.6">할일(＝과목)을<br>추가해보세요</div></div>';updateCkBar();return}
  // 선택 항목이 오늘 목록에 없으면 초기화 후 첫 항목 선택
  if(ttSelItem&&!ts.find(function(x){return x.id===ttSelItem}))ttSelItem=null;
  if(!ttSelItem&&ts.length)ttSelItem=ts[0].id;
  list.innerHTML='';ts.forEach(function(t){list.appendChild(ckCard(t))});updateCkBar();bindCk();syncSelDot();
}
function ckCard(t){var div=document.createElement('div');div.className='pc'+(t.id===ttSelItem?' pc-sel':'');div.style.borderLeft='3px solid '+t.color;div.setAttribute('data-card',t.id);
  div.innerHTML='<div class="pc-body"><div class="pc-row1"><div class="cdot" style="background:'+t.color+'" data-cdot="'+t.id+'"></div><input class="pc-name" value="'+esc(t.name)+'" data-nm="'+t.id+'"><button class="pc-del" data-del="'+t.id+'">🗑</button></div><div class="pc-st-row"><button class="pc-sb'+(t.status==='ok'?' s-ok':'')+'" data-st="'+t.id+'" data-v="ok">○</button><button class="pc-sb'+(t.status==='wa'?' s-wa':'')+'" data-st="'+t.id+'" data-v="wa">△</button><button class="pc-sb'+(t.status==='er'?' s-er':'')+'" data-st="'+t.id+'" data-v="er">✕</button></div><div class="pc-timer"><div class="pc-tnum'+(t.running?' run':'')+'" id="ckt-'+t.id+'">'+fmt(t.elapsed)+'</div>'+(t.running?'<button class="pc-tbtn stop" data-stop="'+t.id+'">⏸</button>':'<button class="pc-tbtn start" data-start="'+t.id+'">▶</button>')+'<button class="pc-tbtn" data-reset="'+t.id+'">↺</button></div></div>';
  return div;}
function ckFind(id){return dayItems(ckKey()).find(function(t){return t.id===id})}
function bindCk(){
  var q=function(sel,fn){document.querySelectorAll(sel).forEach(function(el){el.addEventListener('click',function(e){fn(el,e)})})};
  // 카드 본문 클릭 = 시간표 칠하기 과목으로 선택

function localAI(totalH,ok,wa,er,secs){var total=ok+wa+er;if(secs===0)return '아직 공부 기록이 없어요. 첫 타이머를 눌러볼까요? 작은 시작이 큰 변화를 만들어요! 💪';if(er>=ok&&er>0)return '✕ 미완료 항목이 '+er+'개 있어요. 못 한 항목은 내일 첫 번째로 도전해보세요! 한 번 시작하면 반은 된 거예요 💪';if(wa>ok)return '△ 부분완료가 '+wa+'개네요. 시작했다는 것 자체가 대단해요! 조금씩 늘려가요 🌱';if(ok>0)return '○ 완료 '+ok+'개 달성! 완료율 '+Math.round(ok/(total||1)*100)+'%로 좋은 페이스예요. 이대로 계속해요! 🔥';return totalH+'시간 공부했어요! ○△✕로 완료 여부를 체크하면 더 도움이 돼요 ✨'}
